plugins {
    id 'com.android.application'
}

android {
    namespace 'com.callvault.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.callvault.app"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.2.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
}

configurations.all {
    // Force a single Kotlin stdlib version across all transitive dependencies.
    // Prevents the duplicate class error between kotlin-stdlib-1.8.x and
    // the old kotlin-stdlib-jdk7/jdk8-1.6.x split JARs pulled by androidx libs.
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.annotation:annotation:1.7.1'
}
